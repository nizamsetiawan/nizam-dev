<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  
  <!-- Preload Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  >

  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    >
  </noscript>
  
  <!-- SEO Utama -->
  <title>Nizam Setiawan | Software Engineer &amp; Full-Stack Developer</title>
  <meta name="description" content="Portofolio resmi Nizam Setiawan, Software Engineer &amp; Full-Stack Developer. Berfokus pada pembangunan aplikasi web modern, performa tinggi, dan solusi arsitektur kode bersih." />
  <meta name="keywords" content="Nizam Setiawan, Software Engineer, Full-Stack Developer, Portofolio Nizam, Web Developer Indonesia" />
  <meta name="author" content="Nizam Setiawan" />

  <!-- Theme / PWA -->
  <meta name="theme-color" content="#030014" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://github.com/nizamsetiawan/nizam-dev" />
  <meta property="og:title" content="Nizam Setiawan | Software Engineer &amp; Full-Stack Developer" />
  <meta property="og:description" content="Portofolio resmi Nizam Setiawan, Software Engineer &amp; Full-Stack Developer." />
  <meta property="og:image" content="/Photo.jpeg" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://github.com/nizamsetiawan/nizam-dev" />
  <meta name="twitter:title" content="Nizam Setiawan | Software Engineer &amp; Full-Stack Developer" />
  <meta name="twitter:description" content="Portofolio resmi Nizam Setiawan, Software Engineer &amp; Full-Stack Developer." />
  <meta name="twitter:image" content="/Photo.jpeg" />

  <!-- Canonical -->
  <link rel="canonical" href="https://github.com/nizamsetiawan/nizam-dev" />

  <!-- Structured Data: Person -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Nizam Setiawan",
    "url": "https://github.com/nizamsetiawan/nizam-dev",
    "image": "/Photo.jpeg",
    "jobTitle": "Software Engineer & Full-Stack Developer",
    "description": "Berfokus pada penciptaan pengalaman digital yang bersih, performa tinggi, dan arsitektur web modern.",
    "sameAs": [
      "https://github.com/nizamsetiawan"
    ]
  }
  </script>
</head>

<body>
  <!-- Konten teks penting untuk SEO -->
  <header style="display:none">
    <h1>Nizam Setiawan</h1>
    <p>
      Portofolio resmi Nizam Setiawan, Software Engineer &amp; Full-Stack Developer. Berfokus pada pembangunan aplikasi web modern, performa tinggi, dan solusi arsitektur kode bersih.
    </p>
  </header>

  <!-- Root React -->
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
